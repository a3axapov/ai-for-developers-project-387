name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Setup, sequential browser tests, image build and smoke test took 28-35 min
    # on recent runs. Keep a bounded budget with headroom for runner variation.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
      - run: mise run test:browser:install
      - run: mise run check
      - run: mise run image:build
      - run: mise run image:test

  head-browser-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify and record the checked-out SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/head-browser"
          actual=$(git rev-parse HEAD)
          printf '%s\n' "$actual" | tee "$RUNNER_TEMP/head-browser/head-sha.txt"
          test "$actual" = "$HEAD_SHA"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
      - run: mise run test:browser:install
      - name: Run the booking and adjacent browser scenarios
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/head-browser/results.json
        run: |
          set -euo pipefail
          mise run test:browser:targeted -- tests/navigation.spec.ts tests/public-booking.spec.ts \
            --project desktop --project mobile --trace on --reporter=list,json \
            --output "$RUNNER_TEMP/head-browser/traces"
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: head-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/head-browser/
          if-no-files-found: error
