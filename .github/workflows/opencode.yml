name: opencode
run-name: >-
  ${{ (github.event.pull_request.number || github.event.issue.pull_request.url)
  && format('opencode PR #{0}', github.event.pull_request.number || github.event.issue.number)
  || format('opencode issue #{0}', github.event.issue.number) }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  opencode:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(github.event.comment.body, 'implement-spec') && 180 || 60 }}
    concurrency:
      group: opencode-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6

      - name: Install Chromium for implement-spec
        if: contains(github.event.comment.body, 'implement-spec')
        timeout-minutes: 10
        run: mise run test:browser:install

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.6 --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run opencode
        timeout-minutes: ${{ contains(github.event.comment.body, 'implement-spec') && 165 || 15 }}
        env:
          MODEL: opencode/deepseek-v4.1-flash
          VARIANT: low
          MENTIONS: /opencode,/oc
          SHARE: 'false'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "external_directory": "deny",
                "doom_loop": "deny"
              }
            }
        run: opencode github run

  gate:
    if: >-
      (github.event.issue.pull_request != null ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.pull_request.head.repo.full_name == github.repository)) &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Decide whether the command is trusted
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR" \
            --json number,state,headRepository,isCrossRepository \
            > "$RUNNER_TEMP/pr.json"
          node scripts/pr-command-gate.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --pr "$RUNNER_TEMP/pr.json" \
            > "$RUNNER_TEMP/gate.json"
          cat "$RUNNER_TEMP/gate.json"
          echo "allowed=$(jq -r .allowed "$RUNNER_TEMP/gate.json")" >> "$GITHUB_OUTPUT"

  pr-command:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      decision: ${{ steps.reservation.outputs.decision }}
      sha: ${{ steps.reservation.outputs.sha }}
      model_result: ${{ steps.model.outputs.result }}
    concurrency:
      group: opencode-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      id-token: write
    steps:
      - name: Checkout trusted command gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reserve a PR command attempt
        id: reservation
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-command-limit.mjs

      - name: Record admitted PR command
        if: steps.reservation.outputs.decision == 'allow'
        run: echo "Admitted for this Actions run attempt"

      - name: Checkout pull request head
        if: steps.reservation.outputs.decision == 'allow'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.reservation.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base branch and record its SHA
        id: base
        if: steps.reservation.outputs.decision == 'allow'
        timeout-minutes: 5
        env:
          BASE_REF: ${{ steps.reservation.outputs.base_ref }}
        run: |
          set -euo pipefail
          base_ref="$BASE_REF"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          base_sha=$(git rev-parse "origin/$base_ref^{commit}")
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Base branch: \`$base_ref\` at \`$base_sha\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Install project tools
        if: steps.reservation.outputs.decision == 'allow'
        timeout-minutes: 10
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6

      - name: Install opencode
        if: steps.reservation.outputs.decision == 'allow'
        timeout-minutes: 5
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.6 --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Check the PR is still open at the reserved head
        if: steps.reservation.outputs.decision == 'allow'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXPECTED_HEAD: ${{ steps.reservation.outputs.sha }}
        run: |
          set -euo pipefail
          current=$(gh pr view "$PR" --json state,headRefOid --jq 'select(.state == "OPEN") | .headRefOid')
          if [[ "$current" != "$EXPECTED_HEAD" ]]; then
            echo "::error::PR closed or head changed after reserving $EXPECTED_HEAD; use a new comment if still relevant."
            exit 1
          fi

      - name: Run opencode
        id: model
        if: steps.reservation.outputs.decision == 'allow'
        timeout-minutes: 63
        env:
          MODEL: opencode/deepseek-v4.1-flash
          VARIANT: low
          MENTIONS: /opencode,/oc
          SHARE: 'false'
          BASE_REF_NAME: ${{ steps.base.outputs.base_ref }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "instructions": ["docs/agents/pr-command.md"],
              "permission": {
                "external_directory": "deny",
                "doom_loop": "deny"
              }
            }
        run: |
          set -uo pipefail
          if [[ -z "$OPENCODE_API_KEY" ]] || ! command -v opencode >/dev/null; then
            echo 'result=infra' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          timeout --kill-after=30s 60m opencode github run
          code=$?
          case "$code" in
            0) result=success ;;
            124|137) result=timeout ;;
            125|126|127) result=infra ;;
            *) result=agent_failed ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$code"

  report-pr-command:
    needs: [gate, pr-command]
    if: >-
      !cancelled() && needs.gate.outputs.allowed == 'true' &&
      (needs.pr-command.outputs.decision == 'limit_exhausted' ||
       needs.pr-command.result == 'failure' ||
       needs.pr-command.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Report the reason without running a model
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SHA: ${{ needs.pr-command.outputs.sha }}
          DECISION: ${{ needs.pr-command.outputs.decision }}
          MODEL_RESULT: ${{ needs.pr-command.outputs.model_result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$DECISION" == limit_exhausted ]]; then
            reason=limit_exhausted
          else
            reason="${MODEL_RESULT:-infra}"
          fi
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid) || sha="$SHA"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            sha='недоступен; проверьте лог'
          fi
          body=$(printf 'Нужен человек: `%s`.\n\nHead SHA: `%s`\nЛог запуска: %s' "$reason" "$sha" "$RUN_URL")
          printf '%s\n' "$body" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
